name: Psalm Static analysis

on: [push]

jobs:
  psalm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark /github/workspace safe inside a container
        run: |
          docker run --rm \
            --entrypoint sh \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            alpine/git -c "git config --global --add safe.directory /github/workspace && git status >/dev/null"

      - name: Psalm
        uses: docker://ghcr.io/psalm/psalm-github-actions